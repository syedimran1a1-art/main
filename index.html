  table.grid-table td::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none;max-width:45%}
  table.grid-table td.c0{font-size:15px;font-weight:700;color:var(--navy);padding-bottom:6px!important;margin-bottom:4px;border-bottom:1px solid #eef2f6!important;text-align:left!important;justify-content:flex-start}
  table.grid-table td.c0::before{display:none}
  table.grid-table td:empty,table.grid-table td[data-l=""]::before{display:none}
  table.grid-table tfoot tr{background:#f1f5fb}
  /* filters: search stays, the rest folds away */
  .filters{gap:8px!important}
  .filters>.fld:first-child{flex:1 1 100%}
  .filters:not(.open)>:not(:first-child):not(.ftog){display:none!important}
  .filters .fld{min-width:calc(50% - 4px)!important;flex:1 1 calc(50% - 4px)}
  .ftog{display:inline-flex!important;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
  /* dialogs: bottom sheets */
  .modal-back{align-items:flex-end!important;padding:0!important}
  .modal{width:100%!important;max-width:100%!important;max-height:92vh!important;overflow:auto;border-radius:20px 20px 0 0!important;padding-bottom:calc(16px + env(safe-area-inset-bottom))!important;animation:v3sheet .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes v3sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  input,select,textarea{font-size:16px!important}
  /* bottom tab bar */
  #mtabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #mtabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7a8699;font-size:10.5px;font-weight:600;padding:4px 0;border-radius:12px;font-family:inherit}
  #mtabs button.on{color:var(--navy)}
  #mtabs button.on svg{stroke-width:2.2}
  #mtabs button.on::after{content:"";width:18px;height:3px;border-radius:3px;background:var(--red);margin-top:1px}
  #toasts{bottom:calc(78px + env(safe-area-inset-bottom))!important;left:12px!important;right:12px!important}
  aside{box-shadow:12px 0 40px rgba(0,0,0,.25)}
  .mscrim{position:fixed;inset:0;background:rgba(11,20,36,.38);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
  .navopen .mscrim{opacity:1;pointer-events:auto}
}
@media (min-width:761px){#mtabs,.mlogo,.mscrim{display:none!important}.ftog{display:none!important}}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const start = () => {
    const app = document.getElementById('app'), top = document.querySelector('.top'); if (!app || !top || !window.V3 || !V3.go) return setTimeout(start, 200);
    if (!document.querySelector('.mlogo')) { const im = document.createElement('img'); im.className = 'mlogo'; im.alt = 'V3'; im.src = window.V3_BRAND ? V3_BRAND.logo : ''; top.insertBefore(im, top.firstChild); }
    const gs = document.getElementById('gsearch'); const mq = matchMedia('(max-width:760px)'); const ph = gs && gs.placeholder;
    const setPh = () => { if (gs) gs.placeholder = mq.matches ? 'Search anything…' : ph; }; setPh(); mq.addEventListener && mq.addEventListener('change', setPh);
    const scrim = document.createElement('div'); scrim.className = 'mscrim'; scrim.onclick = () => app.classList.remove('navopen'); app.appendChild(scrim);
    const bar = document.createElement('nav'); bar.id = 'mtabs'; bar.setAttribute('aria-label', 'Main');
    bar.innerHTML = TABS.map(([k, l, i]) => `<button data-mt="${k}">${svg(i)}<span>${l}</span></button>`).join('');
    document.body.appendChild(bar);
    bar.addEventListener('click', e => { const b = e.target.closest('[data-mt]'); if (!b) return; const k = b.dataset.mt;
      if (k === '_more') { app.classList.toggle('navopen'); return; }
      app.classList.remove('navopen'); V3.go(k); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    const mark = () => { const cur = V3.state && V3.state.mod; bar.querySelectorAll('[data-mt]').forEach(b => b.classList.toggle('on', b.dataset.mt === cur || (b.dataset.mt === '_more' && !TABS.some(t => t[0] === cur)))); };
    const og = V3.go; V3.go = function () { const r = og.apply(this, arguments); app.classList.remove('navopen'); mark(); return r; }; mark();
    // filters: add a "More filters" toggle when there is more than the search box
    const tidy = () => document.querySelectorAll('.filters').forEach(f => { if (f.querySelector('.ftog') || f.children.length < 2) return;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'ftog'; b.textContent = 'More filters ▾'; f.appendChild(b);
      b.onclick = () => { f.classList.toggle('open'); b.textContent = f.classList.contains('open') ? 'Fewer filters ▴' : 'More filters ▾'; }; });
    new MutationObserver(() => { tidy(); mark(); }).observe(document.getElementById('view'), { childList: true, subtree: true }); tidy();
  };
  start();
})();

</script>
