      ${window.V3_STORAGE_PANEL ? '' : `<p class="muted small">Where your data lives: every record is stored in this app's central cloud database, and every uploaded or archived file in its cloud file store — not on your computer. Each file carries links to the customer, quotation, PO, invoice, delivery note or payment it belongs to. Any signed-in user sees the same data on any PC or phone. As extra protection an <b>automatic daily cloud backup</b> of the records is taken when an administrator opens the app, and you can download a complete package (records + files) at any time.</p>`}
      ${window.V3_STORAGE_PANEL ? '<div id="storagePanel">' + (V3.storagePanelHtml ? V3.storagePanelHtml() : '') + '</div>' : ''}${V3.backupPanelExtra ? V3.backupPanelExtra(isAdmin) : ''}<h3>Records only (JSON)</h3>
      <div class="actions"><button class="btn ghost" data-act="dlbackup">Download records only (JSON)</button>${V3.P.assets && V3.cloudBackup ? '<button class="btn ghost" data-act="cloudbackup">Create cloud backup now</button>' : ''}${isAdmin ? `<label class="btn ghost">Restore from file…<input type="file" id="restoreFile" accept=".json,application/json" hidden></label><label class="btn ghost">Import customers &amp; materials from old app…<input type="file" id="legacyFile" accept=".json,application/json" hidden></label>` : ''}</div>
      <label class="chk"><input type="checkbox" id="autoB" ${C.autoBackup ? 'checked' : ''} ${isAdmin ? '' : 'disabled'}> Automatic daily cloud backup</label>
      <h3>Cloud backups</h3>${table([{ h: 'Taken', f: b => esc(new Date(b.at).toLocaleString()) }, { h: 'Type', f: b => esc(b.kind) }, { h: 'Records', num: true, f: b => Object.values(b.counts || {}).reduce((s, x) => s + x, 0) }, { h: 'Size', num: true, f: b => (num(b.size) / 1024).toFixed(0) + ' KB' }, { h: '', f: b => `<a class="btn ghost sm" href="${esc(V3.blobUrl(b.assetId))}" target="_blank" rel="noopener">Open</a> ${isAdmin ? `<button class="btn ghost sm" data-rb="${b.id}">Restore…</button>` : ''}` }], backups.slice(0, 30), { empty: 'No cloud backups yet.' })}</section>
    <section data-pane="archive" class="panel" ${this.tab === 'archive' ? '' : 'hidden'}>${V3.archivePanelHtml ? V3.archivePanelHtml(isAdmin) : ''}</section>
    <section data-pane="zatca" class="panel" ${this.tab === 'zatca' ? '' : 'hidden'}><h2>ZATCA e-invoicing</h2>
      <div class="note boxed"><p><b>What this system does:</b> issues standard tax invoices and credit notes with every mandatory field (seller and buyer name, VAT numbers and address, sequential number, issue date and time, supply date, line VAT rates and amounts, totals and VAT in SAR), locks them once issued, corrects them only by credit note, gives each a unique UUID, and prints the Phase 1 QR code (TLV-encoded seller name, VAT number, timestamp, total and VAT — no extra fields).</p>
      <p><b>What it cannot do on its own:</b> Phase 2 (Integration) requires each invoice to be generated as UBL 2.1 XML, cryptographically stamped with a ZATCA-issued certificate (CSID) from an onboarded device, and sent to the Fatoora platform for clearance before it is given to a B2B customer. That needs a ZATCA-registered solution connected to Fatoora; this app cannot connect to external servers.</p>
      <p><b>Why it matters now:</b> ZATCA's Wave 25 (announced 24 July 2026) covers taxpayers whose VAT-taxable revenue exceeded SAR 187,500 in any of 2022–2025, with an integration deadline of 1 February 2027. Check whether V3 has received its ZATCA notification.</p>
      <p><b>Recommended set-up:</b> keep using this system for quotations, orders, deliveries, payments and reporting; issue the final cleared invoice through an approved e-invoicing provider; then record the clearance status and reference on each invoice ("Record ZATCA / e-invoicing status") and upload the cleared PDF/XML to the archive.</p></div>
      <p class="small">QR self-test for the latest issued invoice: ${(() => { const i = V3.list('invoices', x => x.qr).sort((a, b) => String(b.issueTimestamp).localeCompare(a.issueTimestamp))[0]; if (!i) return 'no issued invoice yet.'; const d = V3.decodeTLV(i.qr); return `${esc(i.no)} → seller "${esc(d[1])}", VAT ${esc(d[2])}, time ${esc(d[3])}, total ${esc(d[4])}, VAT ${esc(d[5])}`; })()}</p></section>
    <section data-pane="data" class="panel" ${this.tab === 'data' ? '' : 'hidden'}><h2>Database usage</h2><p class="muted small">The central database holds up to 25,000 records in total; files are stored separately (up to 20 MB each). ${totalDocs.toLocaleString()} records used (${(totalDocs / 250).toFixed(1)}%).</p>
      <div class="meter"><i style="width:${Math.min(100, totalDocs / 250)}%"></i></div>${table([{ h: 'Collection', f: x => esc(x[0]) }, { h: 'Records', num: true, f: x => x[1].toLocaleString() }], counts)}
      <p class="muted small">Signed in as ${esc(V3.userName(V3.P.uid))} · role ${esc(V3.ROLES[V3.role()])}${V3.P.isOwner ? ' · owner' : ''}.</p></section>`;
    V3.$$('[data-tab]', el).forEach(b => b.onclick = () => { this.tab = b.dataset.tab; V3.$$('[data-tab]', el).forEach(x => x.classList.toggle('on', x === b)); V3.$$('[data-pane]', el).forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab); });
    V3.bindForm(V3.$('#coform', el), C); if (!isAdmin) V3.$$('#coform input,#coform textarea', el).forEach(i => i.disabled = true);
    V3.$$('[data-perm]', el).forEach(c => c.onchange = () => { const [r, m, a] = c.dataset.perm.split('|'); const L = new Set((R.matrix[r] ||= {})[m] || []); c.checked ? L.add(a) : L.delete(a); R.matrix[r][m] = V3.ACTIONS.filter(x => L.has(x)); });
    V3.$$('[data-role]', el).forEach(s => s.onchange = () => { R.members[s.dataset.role].role = s.value; });
    V3.$$('[data-nb]', el).forEach(i => i.onchange = () => { const [k, f] = i.dataset.nb.split('|'); (NB[k] ||= {})[f] = f === 'pad' || f === 'start' ? num(i.value) : i.value; });
    if (isAdmin && V3.$('[data-combo="uAdd"]', el)) {
      V3.bindCombo('uAdd', [], () => { });
      const txt = V3.$('#uAdd_txt', el); let tm;
      const search = async q => { if (!V3.P.user || !V3.P.user.search) { V3.comboItems.uAdd = []; return; } try { const hits = await V3.P.user.search(q || ''); const list = (Array.isArray(hits) ? hits : (hits && hits.results) || []); V3.comboItems.uAdd = list.map(h => ({ id: h.id, label: h.name || h.email || h.id, sub: h.email || (h.guest ? 'guest' : '') })); list.forEach(h => { if (h.name) V3.P.names[h.id] = h.name; }); txt.dispatchEvent(new Event('input')); } catch (e) { } };
      txt.addEventListener('focus', () => search('')); txt.addEventListener('keyup', e => { if (['ArrowDown', 'ArrowUp', 'Enter', 'Escape'].includes(e.key)) return; clearTimeout(tm); tm = setTimeout(() => search(txt.value), 300); });
    }
    const rf = V3.$('#restoreFile', el); if (rf) rf.onchange = async () => { const f = rf.files[0]; rf.value = ''; if (!f) return; try { const snap = JSON.parse(await f.text()); await this.doRestore(snap); } catch (e) { V3.toast('Could not read backup: ' + V3.errText(e), 'err'); } };
    const lf = V3.$('#legacyFile', el); if (lf) lf.onchange = async () => { const f = lf.files[0]; lf.value = ''; if (!f) return; try { const old = JSON.parse(await f.text()); const ok = await V3.confirm('Import from previous app', `Found ${(old.customers || []).length} customers and ${(old.materials || []).length} materials. Import them? Existing records are not changed.`); if (!ok) return; const n = await V3.importLegacy(old); V3.toast(n + ' records imported'); } catch (e) { V3.toast('Could not import: ' + V3.errText(e), 'err'); } };
    el.onclick = async e => {
      const a = e.target.closest('[data-act],[data-rb],[data-unrole]'); if (!a) return;
      try {
        if (a.dataset.unrole) { delete R.members[a.dataset.unrole]; await V3.save('settings', { ...R, id: 'roles' }, { action: 'User removed' }); return; }
        if (a.dataset.rb) { const b = V3.get('backups', a.dataset.rb); const resp = await fetch(V3.blobUrl(b.assetId)); const snap = await resp.json(); return this.doRestore(snap); }
        const act = a.dataset.act;
        if (act === 'saveco') { if (!/^3\d{13}3$/.test(C.vat)) throw new Error('VAT number must be 15 digits starting and ending with 3.'); C.autoBackup = V3.$('#autoB', el).checked; await V3.save('settings', { ...C, id: 'company' }, { action: 'Company details changed' }); V3.toast('Company details saved — all documents now use them'); }
        if (act === 'saveroles') { await V3.save('settings', { ...R, id: 'roles' }, { action: 'Roles & permissions changed' }); V3.toast('Roles & permissions saved'); }
        if (act === 'resetperm') { R.matrix = V3.clone(V3.DEFAULT_MATRIX); await V3.save('settings', { ...R, id: 'roles' }, { action: 'Permissions reset to defaults' }); V3.toast('Defaults restored'); }
        if (act === 'adduser') { const id = V3.val('uAdd'); if (!id) throw new Error('Search and select a person first.'); R.members[id] = { role: V3.val('uRole'), addedAt: new Date().toISOString() }; await V3.save('settings', { ...R, id: 'roles' }, { action: 'User role assigned', reason: V3.ROLES[V3.val('uRole')] }); V3.toast('User added'); }
        if (act === 'savenum') { await V3.save('settings', { ...NB, id: 'numbering' }, { action: 'Numbering format changed' }); V3.toast('Numbering saved'); }
        if (act === 'dlbackup') { await V3.saveFile(`V3-backup-${today()}.json`, JSON.stringify(V3.snapshot(), null, 1), 'application/json'); V3.audit({ col: 'system', ref: 'Backup', action: 'Backup file downloaded' }); }
        if (act === 'cloudbackup') { a.disabled = true; await V3.cloudBackup('Manual'); V3.toast('Cloud backup created'); }
        const ab = V3.$('#autoB', el); if (ab && act === undefined) { }
      } catch (er) { V3.toast(V3.errText(er), 'err'); } finally { a.disabled = false; }
    };
    const ab = V3.$('#autoB', el); if (ab && isAdmin) ab.onchange = async () => { try { await V3.save('settings', { ...V3.company(), id: 'company', autoBackup: ab.checked }, { action: 'Automatic backup ' + (ab.checked ? 'enabled' : 'disabled') }); } catch (er) { V3.toast(V3.errText(er), 'err'); } };
  },
  async doRestore(snap) {
    if (!snap || !snap.data) throw new Error('Not a V3 backup file.');
    const cnt = Object.entries(snap.data).map(([k, v]) => `${k}: ${v.length}`).join(', ');
    const r = await V3.dialog({ title: 'Restore backup', html: `<p>Backup taken <b>${esc(new Date(snap.exportedAt).toLocaleString())}</b><br><small class="muted">${esc(cnt)}</small></p><label class="chk"><input type="radio" name="rm" value="missing" checked> Add back only records that are missing (safe)</label><label class="chk"><input type="radio" name="rm" value="all"> Overwrite all records with the backup versions</label><p class="muted small">Records created after the backup are kept in both modes. The restore is recorded in the audit trail. A fresh cloud backup is taken first.</p>`, okText: 'Restore', danger: true, collect: w => ({ mode: V3.$('input[name=rm]:checked', w).value }) });
    if (!r) return;
    if (V3.P.assets) { try { await V3.cloudBackup('Before restore'); } catch (e) { } }
    const n = await V3.restore(snap, r.mode); V3.toast(`Restore complete — ${n} records processed`);
  }
};

/* ---------------- Global search ---------------- */
V3.globalSearch = q => {
  q = norm(q); if (q.length < 2) return [];
  const out = []; const push = (mod, id, title, sub, kind) => out.push({ mod, id, title, sub, kind });
  const m = (...v) => norm(v.join(' ')).includes(q);
  V3.list('customers').forEach(c => m(c.name, c.vat, c.contact, c.phone, c.email) && push('customers', c.id, c.name, c.vat ? 'VAT ' + c.vat : c.contact, 'Customer'));
  V3.list('suppliers').forEach(c => m(c.name, c.vat, c.contact) && push('suppliers', c.id, c.name, c.vat || '', 'Supplier'));
  V3.list('materials').forEach(c => m(c.name, c.code) && push('materials', c.id, c.name, [c.code, c.unit, amt(c.price)].filter(Boolean).join(' · '), 'Material'));
  V3.list('quotations').forEach(c => m(c.no, ...(c.formerNos || []), c.custName, c.project, c.rfq) && push('quotations', c.id, c.no, [c.custName, c.project, V3.quoteStatus(c)].filter(Boolean).join(' · '), 'Quotation'));
  V3.list('customerPOs').forEach(c => m(c.poNo, c.custName) && push('customerPOs', c.id, 'PO ' + c.poNo, [c.custName, c.quotationNo].join(' · '), 'Customer PO'));
  V3.list('supplierPOs').forEach(c => m(c.no, c.supName, c.project) && push('supplierPOs', c.id, c.no, [c.supName, c.project].filter(Boolean).join(' · '), 'Supplier PO'));
  V3.list('supplierInvoices').forEach(c => m(c.invNo, c.supName) && push('supplierInvoices', c.id, 'Supplier inv ' + c.invNo, c.supName, 'Supplier invoice'));
  V3.list('deliveryNotes').forEach(c => m(c.no, c.custName, c.project, c.vehicle) && push('deliveries', c.id, c.no, [c.custName, c.status].join(' · '), 'Delivery note'));
  V3.list('invoices').forEach(c => m(c.no, c.custName, c.project, c.quotationNo) && push('invoices', c.id, c.no || 'Draft invoice', [c.custName, money(c.total, c.currency)].join(' · '), c.docType === 'CN' ? 'Credit note' : 'Invoice'));
  V3.list('payments').forEach(c => m(c.no, c.bankRef, c.receiptRef, c.invoiceNo) && push('payments', c.id, c.no, [c.custName, money(c.amount), c.bankRef].filter(Boolean).join(' · '), 'Customer payment'));
  V3.list('supplierPayments').forEach(c => m(c.no, c.ref, c.supName) && push('supplierPayments', c.id, c.no, [c.supName, money(c.amount), c.ref].filter(Boolean).join(' · '), 'Supplier payment'));
  return out.filter(r => V3.can(V3.MOD_PERM[r.mod] || r.mod, 'view')).slice(0, 40);
};
})();

</script>
<script>
/* m_proj.js */
/* V3 — projects: every document of one customer project in one place, with expected / actual / cash views */
'use strict';
(() => {
const { esc, num, r2, fmtDate, money, amt, norm, badge, table } = V3;
const LIVE = x => x.status !== 'Cancelled';

/* a project = one customer + one project name (quotations without a project name stand alone) */
V3.projectsAll = () => {
  const map = {};
  V3.list('quotations', q => q.status !== 'Cancelled').forEach(q => {
    const key = V3.projKey(q.customerId, q.project, q.no);
    const p = map[key] ||= { key, name: q.project || q.no, customerId: q.customerId, custName: q.custName, quotes: [] };
    p.quotes.push(q);
  });
  return Object.values(map);
};
V3.projectByKey = key => V3.projectsAll().find(p => p.key === key) || null;
V3.projectKeyOfQuote = qid => { const q = V3.get('quotations', qid); return q ? V3.projKey(q.customerId, q.project, q.no) : ''; };

V3.projectData = p => {
  const qids = new Set(p.quotes.map(q => q.id));
  const pos = V3.list('customerPOs', x => qids.has(x.quotationId) && LIVE(x)); const poIds = new Set(pos.map(x => x.id));
  const invs = V3.list('invoices', i => qids.has(i.quotationId) && !['Draft', 'Cancelled'].includes(i.status));
  const invIds = new Set(invs.map(i => i.id));
  const pays = V3.list('payments', x => LIVE(x) && (invIds.has(x.invoiceId) || (!x.invoiceId && poIds.has(x.customerPOId))));
  const spos = V3.list('supplierPOs', x => LIVE(x) && (qids.has(x.quotationId) || poIds.has(x.customerPOId))); const spoIds = new Set(spos.map(x => x.id));
  const sinvs = V3.list('supplierInvoices', x => LIVE(x) && spoIds.has(x.supplierPOId));
  const spays = V3.list('supplierPayments', x => LIVE(x) && spoIds.has(x.supplierPOId));
  const costs = V3.list('directCosts', x => LIVE(x) && qids.has(x.quotationId));
  const dns = V3.list('deliveryNotes', x => LIVE(x) && qids.has(x.quotationId));
  return { qids, pos, invs, pays, spos, sinvs, spays, costs, dns };
};

V3.projectFin = p => {
  const D = V3.projectData(p); const S = (arr, f) => r2(arr.reduce((s, x) => s + f(x), 0));
  const sg = i => i.docType === 'CN' ? -1 : 1;
  const won = p.quotes.filter(q => !['Rejected'].includes(q.status));
  const c = {
    quotedNet: S(won, q => V3.toSAR(q, q.taxable ?? V3.calcLines(q.lines, q.discount).taxable)), quotedGross: S(won, q => V3.toSAR(q, q.total)),
    poNet: S(D.pos, x => V3.toSAR(x, x.subtotal)), poGross: S(D.pos, x => V3.toSAR(x, x.total)),
    invNet: S(D.invs, i => sg(i) * V3.toSAR(i, i.taxable)), invGross: S(D.invs, i => sg(i) * V3.toSAR(i, i.total)),
    received: S(D.pays, x => (x.type === 'refund' ? -1 : 1) * V3.toSAR(V3.get('invoices', x.invoiceId) || V3.get('customerPOs', x.customerPOId) || {}, x.amount)),
    outstanding: S(D.invs.filter(i => i.docType !== 'CN'), i => V3.toSAR(i, Math.max(0, V3.invoiceStatus(i).balance))),
    credit: r2(S(D.invs.filter(i => i.docType !== 'CN'), i => V3.toSAR(i, Math.max(0, -V3.invoiceStatus(i).balance))) + S(D.pos, x => V3.toSAR(x, V3.poAdvances(x.id).unapplied)))
  };
  const s = {
    spoNet: S(D.spos, x => V3.toSAR(x, x.subtotal)), spoGross: S(D.spos, x => V3.toSAR(x, x.total)),
    invNet: S(D.sinvs, x => num(x.subtotal)), invGross: S(D.sinvs, x => num(x.total)), paid: S(D.spays, x => num(x.amount))
  };
  s.outstanding = r2(Math.max(0, s.invGross - s.paid)); s.advance = r2(Math.max(0, s.paid - s.invGross)); s.remaining = r2(Math.max(0, s.spoNet - s.invNet));
  const direct = S(D.costs, x => num(x.amount)), directGross = S(D.costs, x => num(x.amount) + num(x.vat));
  // expected: confirmed order value (or quotation if no PO yet) vs supplier cost for the same quantities
  let expRev, expCost;
  if (D.pos.length) { const deals = D.pos.map(x => V3.dealFor(x.id)); expRev = S(deals, d => d.sales); expCost = S(deals, d => d.cost); }
  else { expRev = c.quotedNet; expCost = S(won, q => q.lines.reduce((t, l) => { const m = V3.lineMat(l); return t + (m ? num(m.cost) * num(l.qty) : 0); }, 0)); }
  expCost = r2(expCost + direct);
  const actCost = r2(S(D.invs, i => V3.invoiceCost(i).cost) + direct);
  const e = { revenue: r2(expRev), cost: expCost, profit: r2(expRev - expCost) }; e.margin = e.revenue ? e.profit / e.revenue * 100 : 0;
  const a = { revenue: c.invNet, cost: actCost, profit: r2(c.invNet - actCost) }; a.margin = a.revenue ? a.profit / a.revenue * 100 : 0;
  const cash = { in: c.received, out: r2(s.paid + directGross) }; cash.net = r2(cash.in - cash.out);
  const status = D.pos.length ? (D.pos.every(x => x.status === 'Closed') ? 'Completed' : 'In progress') : (p.quotes.every(q => ['Rejected', 'Expired'].includes(V3.quoteStatus(q))) ? 'Lost' : 'Quoted');
  return { D, c, s, direct, e, a, cash, status };
};

/* ---------- Projects list ---------- */
const pf = { q: '', status: '', cust: '' };
V3.mods.projects = {
  title: 'Projects', perm: 'reports',
  render(el) {
    if (V3.state.id) return this.view(el, V3.state.id);
    const all = V3.projectsAll().map(p => ({ p, f: V3.projectFin(p) }));
    const rows = all.filter(x => (!pf.status || x.f.status === pf.status) && (!pf.cust || x.p.customerId === pf.cust) && (!pf.q || norm([x.p.name, x.p.custName, ...x.p.quotes.map(q => q.no), ...x.f.D.pos.map(V3.poLabel)].join(' ')).includes(norm(pf.q)))).sort((a, b) => b.f.c.poNet - a.f.c.poNet || a.p.name.localeCompare(b.p.name));
    const T = f => r2(rows.reduce((s, x) => s + f(x), 0));
    el.innerHTML = `<div class="page-head"><div><h1>Projects</h1><p class="muted">Each project brings together its quotations, customer POs, invoices and receipts with its supplier POs, supplier invoices, supplier payments and direct costs. Click a project for its full financial position.</p></div></div>
    <div class="kpis"><div><span>Confirmed orders (excl. VAT)</span><b>${money(T(x => x.f.c.poNet))}</b></div><div><span>Expected gross profit</span><b class="pos">${money(T(x => x.f.e.profit))}</b></div><div><span>Actual gross profit (invoiced)</span><b>${money(T(x => x.f.a.profit))}</b></div><div><span>Outstanding from customers</span><b class="warn">${money(T(x => x.f.c.outstanding))}</b></div><div><span>Owed to suppliers</span><b class="warn">${money(T(x => x.f.s.outstanding))}</b></div></div>
    <div class="panel"><div class="filters"><label class="fld grow"><span>Search project, customer, quotation or PO</span><input id="prq" value="${esc(pf.q)}"></label>
    <label class="fld"><span>Customer</span><select id="prc"><option value="">All customers</option>${V3.custItems().map(c => `<option value="${c.id}" ${pf.cust === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select></label>
    <label class="fld"><span>Status</span><select id="prs"><option value="">All</option>${['Quoted', 'In progress', 'Completed', 'Lost'].map(s => `<option ${pf.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label><div class="count">${rows.length} projects</div></div>
    ${table([{ h: 'Project', f: x => `<b>${esc(x.p.name)}</b><br><small class="muted">${esc(x.p.quotes.map(q => q.no).join(', '))}</small>` }, { h: 'Customer', f: x => esc(x.p.custName || '') }, { h: 'Order value', num: true, f: x => amt(x.f.c.poNet || x.f.c.quotedNet) + (x.f.c.poNet ? '' : '<br><small class="muted">quoted</small>') }, { h: 'Expected GP', num: true, f: x => `${amt(x.f.e.profit)}<br><small class="${x.f.e.margin < 0 ? 'neg' : 'muted'}">${x.f.e.revenue ? x.f.e.margin.toFixed(1) + '%' : '—'}</small>` }, { h: 'Invoiced', num: true, f: x => amt(x.f.c.invNet) }, { h: 'Actual GP', num: true, f: x => x.f.a.revenue ? `<b class="${x.f.a.profit < 0 ? 'neg' : 'pos'}">${amt(x.f.a.profit)}</b><br><small class="muted">${x.f.a.margin.toFixed(1)}%</small>` : '—' }, { h: 'Received', num: true, f: x => amt(x.f.c.received) }, { h: 'Customer owes', num: true, f: x => x.f.c.outstanding ? `<b class="warn">${amt(x.f.c.outstanding)}</b>` : '—' }, { h: 'We owe supplier', num: true, f: x => x.f.s.outstanding ? amt(x.f.s.outstanding) : '—' }, { h: 'Status', f: x => badge(x.f.status) }], rows, { rowAttr: x => `data-proj="${esc(x.p.key)}" class="click"`, empty: 'No projects yet — projects appear as soon as a quotation is saved.' })}</div>`;
    const q = V3.$('#prq', el); q.oninput = () => { pf.q = q.value; this.render(el); const n = V3.$('#prq', el); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    V3.$('#prc', el).onchange = e => { pf.cust = e.target.value; this.render(el); }; V3.$('#prs', el).onchange = e => { pf.status = e.target.value; this.render(el); };
    el.onclick = e => { const r = e.target.closest('[data-proj]'); if (r && !e.target.closest('a')) V3.go('projects', r.dataset.proj); };
  },

  view(el, key) {
    const p = V3.projectByKey(key);
    if (!p) { el.innerHTML = '<div class="panel">Project not found (the quotation may have been cancelled or renamed). <a data-go="projects">Back to projects</a></div>'; return; }
    const F = V3.projectFin(p), D = F.D;
    const k = (l, v, cls = '', sub = '') => `<div><span>${esc(l)}</span><b class="${cls}">${v}</b>${sub ? `<small class="muted" style="display:block;font-size:11px">${sub}</small>` : ''}</div>`;
    const ev = [];
    const add = (date, kind, ref, go, party, amount, sign, status) => ev.push({ date, kind, ref, go, party, amount, sign, status });
    p.quotes.forEach(q => add(q.date, 'Customer quotation', q.no, 'quotations:' + q.id, q.custName, q.total, 0, V3.quoteStatus(q)));
    D.pos.forEach(x => add(x.poDate, 'Customer PO', V3.poLabel(x), 'customerPOs:' + x.id, x.custName, x.total, 0, x.status));
    D.dns.forEach(x => add(x.date, 'Delivery note', x.no, 'deliveries:' + x.id, x.custName, null, 0, x.status));
    D.invs.forEach(i => add(i.date, i.docType === 'CN' ? 'Credit note' : 'Customer tax invoice', i.no, 'invoices:' + i.id, i.custName, i.total, i.docType === 'CN' ? -1 : 0, V3.invDisplayStatus(i)));
    D.pays.forEach(x => add(x.date, x.type === 'refund' ? 'Refund to customer' : (x.invoiceId ? 'Customer receipt' : 'Customer advance'), x.no, 'payments:' + x.id, x.custName, x.amount, x.type === 'refund' ? -1 : 1, x.invoiceId ? 'against ' + (x.invoiceNo || '') : 'against PO ' + (x.customerPONo || '')));
    D.spos.forEach(x => add(x.date, 'Supplier PO', x.no, 'supplierPOs:' + x.id, x.supName, x.total, 0, x.status));
    D.sinvs.forEach(x => add(x.date, 'Supplier invoice', x.invNo, 'supplierInvoices:' + x.id, x.supName, x.total, 0, x.supplierPONo || ''));
    D.spays.forEach(x => add(x.date, 'Supplier payment', x.no, 'supplierPayments:' + x.id, x.supName, x.amount, -1, x.supplierPONo || ''));
    D.costs.forEach(x => add(x.date, 'Direct cost', x.category, 'costs:' + x.id, x.vendor || '', r2(num(x.amount) + num(x.vat)), -1, x.description || ''));
    ev.sort((a, b) => String(a.date).localeCompare(b.date));
    const bar = (label, v, max, color) => `<div class="hbar"><span>${esc(label)}</span><div><i style="width:${max ? Math.max(0, Math.min(100, v / max * 100)) : 0}%;background:${color}"></i></div><b>${amt(v)}</b></div>`;
    const mx = Math.max(F.e.revenue, F.a.revenue, F.e.cost, F.a.cost, 1);
    el.innerHTML = `<div class="page-head"><div><button class="btn ghost sm" data-go="projects">← Projects</button><h1>${esc(p.name)} ${badge(F.status)}</h1><p class="small">Customer <a data-go="customers:${p.customerId}"><b>${esc(p.custName || '')}</b></a> · Quotation${p.quotes.length > 1 ? 's' : ''} ${p.quotes.map(q => `<a data-go="quotations:${q.id}">${esc(q.no)}</a>`).join(', ')}${D.pos.length ? ' · Customer PO ' + D.pos.map(x => `<a data-go="customerPOs:${x.id}">${esc(V3.poLabel(x))}</a>`).join(', ') : ''}</p></div>
      <div class="actions"><button class="btn ghost" data-go="statements:${p.customerId}">Customer statement</button><button class="btn ghost" data-act="pdf">Project report PDF</button></div></div>
    <h2 class="sec">Profitability <small>all amounts excl. VAT, SAR</small></h2>
    <div class="pviews">
      <div class="pview"><h4>Expected</h4><p class="muted small">${D.pos.length ? 'Confirmed customer PO value vs supplier cost for the same quantities' : 'Quotation value vs estimated purchase cost (no customer PO yet)'}, plus direct costs.</p>${bar('Revenue', F.e.revenue, mx, '#2f6bc0')}${bar('Cost', F.e.cost, mx, '#d4651f')}<div class="pv-res ${F.e.profit < 0 ? 'neg' : 'pos'}">Expected profit <b>${money(F.e.profit)}</b> <span>${F.e.revenue ? F.e.margin.toFixed(1) + '%' : '—'}</span></div></div>
      <div class="pview"><h4>Actual</h4><p class="muted small">Invoiced revenue vs cost of the goods invoiced (at supplier PO prices) plus direct costs.</p>${bar('Revenue', F.a.revenue, mx, '#2f6bc0')}${bar('Cost', F.a.cost, mx, '#d4651f')}<div class="pv-res ${F.a.profit < 0 ? 'neg' : 'pos'}">Actual profit <b>${money(F.a.profit)}</b> <span>${F.a.revenue ? F.a.margin.toFixed(1) + '%' : 'nothing invoiced yet'}</span></div></div>
      <div class="pview"><h4>Cash</h4><p class="muted small">Money actually received from the customer minus money paid to suppliers and for direct costs (incl. VAT).</p>${bar('Cash in', F.cash.in, Math.max(F.cash.in, F.cash.out, 1), '#2f6bc0')}${bar('Cash out', F.cash.out, Math.max(F.cash.in, F.cash.out, 1), '#d4651f')}<div class="pv-res ${F.cash.net < 0 ? 'neg' : 'pos'}">Net cash position <b>${money(F.cash.net)}</b></div></div>
    </div>
    <p class="muted small">These three views are deliberately kept separate: a project can be profitable on paper while customer money is still outstanding or suppliers are still unpaid.</p>
    <div class="grid2">
      <div class="panel"><h2>Customer side <small>incl. VAT unless stated</small></h2><div class="kpis sm">${k('Quotation value (excl. VAT)', money(F.c.quotedNet))}${k('Customer PO value (excl. VAT)', money(F.c.poNet))}${k('Invoiced', money(F.c.invGross), '', 'excl. VAT ' + amt(F.c.invNet))}${k('Payments received', money(F.c.received), F.c.received ? 'pos' : '')}${k('Outstanding from customer', money(F.c.outstanding), F.c.outstanding ? 'warn' : '')}${k('Customer credit / advance', money(F.c.credit))}</div></div>
      <div class="panel"><h2>Supplier side <small>incl. VAT unless stated</small></h2><div class="kpis sm">${k('Supplier PO value (excl. VAT)', money(F.s.spoNet))}${k('Supplier invoices', money(F.s.invGross), '', 'excl. VAT ' + amt(F.s.invNet))}${k('Supplier payments', money(F.s.paid))}${k('Outstanding to supplier', money(F.s.outstanding), F.s.outstanding ? 'warn' : '')}${F.s.advance ? k('Advance paid to supplier', money(F.s.advance)) : ''}${k('Committed, not yet invoiced (excl. VAT)', money(F.s.remaining))}${k('Direct project costs (excl. VAT)', money(F.direct))}</div></div>
    </div>
    <div class="panel"><h2>Transaction history <small>${ev.length} documents, oldest first — click to open</small></h2>
    ${table([{ h: 'Date', f: x => fmtDate(x.date) }, { h: 'Document', f: x => `<span class="tag ${/Supplier|Direct/.test(x.kind) ? 'manual' : ''}">${esc(x.kind)}</span>` }, { h: 'Reference', f: x => `<a data-go="${x.go}"><b>${esc(x.ref)}</b></a>` }, { h: 'Customer / supplier', f: x => esc(x.party || '') }, { h: 'Amount', num: true, f: x => x.amount === null || x.amount === undefined ? '—' : `<span class="${x.sign > 0 ? 'pos' : x.sign < 0 ? 'neg' : ''}">${x.sign < 0 ? '−' : ''}${amt(x.amount)}</span>` }, { h: 'Status / note', f: x => /^(Draft|Submitted|Approved|Rejected|Cancelled|Expired|Open|Closed|Issued|Paid|Partially Paid|Overdue|Delivered|Dispatched|Ready for Dispatch|Partially Delivered|Partially Received|Received|Credited)/.test(x.status || '') ? badge(x.status) : `<small class="muted">${esc(x.status || '')}</small>` }], ev, { limit: 500 })}
    <p class="muted small">Amounts include VAT. Green = money in, red = money out or credit.</p></div>`;
    el.onclick = e => { const a = e.target.closest('[data-act="pdf"]'); if (!a) return;
      const rows = ev; const html = V3.docReport('Project financial report', `${p.name} · ${p.custName || ''}`, [{ h: 'Date', v: x => fmtDate(x.date) }, { h: 'Document', v: x => x.kind }, { h: 'Reference', v: x => x.ref }, { h: 'Party', v: x => x.party || '' }, { h: 'Amount', num: true, v: x => x.amount == null ? '' : (x.sign < 0 ? '−' : '') + amt(x.amount) }], rows)
        .replace('<table class="items">', `<table class="items"><thead><tr><th>Profitability (excl. VAT)</th><th class="num">Revenue</th><th class="num">Cost</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody><tr><td>Expected</td><td class="num">${amt(F.e.revenue)}</td><td class="num">${amt(F.e.cost)}</td><td class="num"><b>${amt(F.e.profit)}</b></td><td class="num">${F.e.revenue ? F.e.margin.toFixed(1) + '%' : '—'}</td></tr><tr><td>Actual</td><td class="num">${amt(F.a.revenue)}</td><td class="num">${amt(F.a.cost)}</td><td class="num"><b>${amt(F.a.profit)}</b></td><td class="num">${F.a.revenue ? F.a.margin.toFixed(1) + '%' : '—'}</td></tr><tr><td>Cash (incl. VAT)</td><td class="num">${amt(F.cash.in)}</td><td class="num">${amt(F.cash.out)}</td><td class="num"><b>${amt(F.cash.net)}</b></td><td></td></tr></tbody></table><table class="items" style="margin-top:6px"><thead><tr><th>Customer (incl. VAT)</th><th class="num">Invoiced</th><th class="num">Received</th><th class="num">Outstanding</th><th>Supplier (incl. VAT)</th><th class="num">Invoiced</th><th class="num">Paid</th><th class="num">Outstanding</th></tr></thead><tbody><tr><td></td><td class="num">${amt(F.c.invGross)}</td><td class="num">${amt(F.c.received)}</td><td class="num">${amt(F.c.outstanding)}</td><td></td><td class="num">${amt(F.s.invGross)}</td><td class="num">${amt(F.s.paid)}</td><td class="num">${amt(F.s.outstanding)}</td></tr></tbody></table><h3>Transaction history</h3><table class="items">`);
      V3.exportDoc(html, `Project ${p.name}.pdf`.replace(/[\\/:*?"<>|]/g, '-'));
    };
  }
};
})();

</script>
<script>
/* m_charts.js */
/* V3 — dashboard charts (plain SVG/HTML, interactive: hover for values, click to drill down) */
'use strict';
(() => {
const { esc, num, r2, amt, money, norm } = V3;
const C = { rev: '#2f6bc0', cost: '#d4651f', direct: '#8e6ad8', profit: '#0e8a6a' };
const QST = [['Draft', '#98a2b3'], ['Submitted', '#2f6bc0'], ['Approved', '#16803d'], ['Rejected', '#c8102e'], ['Expired', '#7a5af8']];
const short = v => { v = num(v); const a = Math.abs(v); return (v < 0 ? '−' : '') + (a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'k' : a.toFixed(0)); };
const inR = (d, f, t) => (!f || d >= f) && (!t || d <= t);
const months12 = () => { const out = [], d0 = new Date(); for (let i = 11; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); } return out; };
const mLabel = m => ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(m.slice(5)) - 1] + ' ' + m.slice(2, 4);

/* donut with a 2px surface gap between segments */
const donut = (segs, centerTop, centerSub) => {
  const R = 54, W = 18, Cc = 2 * Math.PI * R; const total = segs.reduce((s, x) => s + x.v, 0);
  let off = 0;
  const arcs = total ? segs.filter(x => x.v > 0).map(x => { const len = x.v / total * Cc; const gap = segs.filter(y => y.v > 0).length > 1 ? 2 : 0; const a = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${x.c}" stroke-width="${W}" stroke-dasharray="${Math.max(0.5, len - gap)} ${Cc}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" class="seg" ${x.attr || ''} data-tip="${esc(x.tip)}"></circle>`; off += len; return a; }).join('') : `<circle r="${R}" cx="70" cy="70" fill="none" stroke="#e4e7ec" stroke-width="${W}"></circle>`;
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Quotation status distribution">${arcs}<text x="70" y="68" text-anchor="middle" class="d-big">${esc(centerTop)}</text><text x="70" y="86" text-anchor="middle" class="d-sub">${esc(centerSub)}</text></svg>`;
};
/* vertical bars, 1 or 2 series */
const vbars = (cats, series, opt = {}) => {
  const mx = Math.max(1, ...series.flatMap(s => s.vals.map(v => Math.max(0, v))));
  return `<div class="bars" style="height:${opt.h || 170}px" role="img" aria-label="${esc(opt.label || '')}">${cats.map((c, i) => `<div class="bcol" data-tip="${esc(mLabel(c) + ': ' + series.map(s => s.name + ' ' + amt(s.vals[i])).join(' · '))}" ${opt.attr ? opt.attr(c) : ''}><div class="bpair">${series.map(s => `<i style="height:${Math.max(0, s.vals[i]) / mx * 100}%;background:${s.color}"></i>`).join('')}</div><span>${mLabel(c).replace(' ', '<br>')}</span></div>`).join('')}</div>`;
};
const legend = items => `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
const hrow = (label, v, max, color, attr = '') => `<div class="hbar" ${attr} data-tip="${esc(label + ': ' + amt(v))}"><span>${esc(label)}</span><div><i style="width:${max ? Math.max(0, Math.min(100, v / max * 100)) : 0}%;background:${color}"></i></div><b>${amt(v)}</b></div>`;

V3.dashCharts = (f, t, dsh) => {
  /* A. Quotations */
  const Q = V3.list('quotations', q => q.status !== 'Cancelled' && inR(q.date, f, t));
  const qsegs = QST.map(([s, c]) => { const L = Q.filter(q => V3.quoteStatus(q) === s); return { s, c, v: L.length, val: r2(L.reduce((a, q) => a + V3.toSAR(q, q.total), 0)) }; });
  const qVal = r2(Q.reduce((a, q) => a + V3.toSAR(q, q.total), 0));
  const months = months12();
  const qMonth = months.map(m => r2(V3.list('quotations', q => q.status !== 'Cancelled' && String(q.date).startsWith(m)).reduce((a, q) => a + V3.toSAR(q, q.total), 0)));
  const qWon = months.map(m => r2(V3.list('quotations', q => V3.quoteStatus(q) === 'Approved' && String(q.date).startsWith(m)).reduce((a, q) => a + V3.toSAR(q, q.total), 0)));
  const cardQ = `<div class="panel chart-card"><div class="ph"><h2>Quotations</h2><a class="small" data-go="quotations">Open register →</a></div>
    <div class="donut-wrap">${donut(qsegs.map(x => ({ v: x.v, c: x.c, tip: `${x.s}: ${x.v} quotation(s) · SAR ${amt(x.val)}`, attr: `data-qst="${x.s}"` })), String(Q.length), 'quotations')}
    <div class="dlegend">${qsegs.map(x => `<div class="click" data-qst="${x.s}"><i style="background:${x.c}"></i><span>${x.s === 'Submitted' ? 'Pending customer approval' : x.s}</span><b>${x.v}</b><small>${short(x.val)}</small></div>`).join('')}<div class="dl-total"><span>Total value</span><b>${money(qVal)}</b></div></div></div>
    <h4 class="ch-sub">Quotation value by month (incl. VAT)</h4>${legend([['All quotations', C.rev], ['Approved', C.profit]])}${vbars(months, [{ name: 'Quoted', vals: qMonth, color: C.rev }, { name: 'Approved', vals: qWon, color: C.profit }], { h: 130, label: 'Quotation value by month', attr: m => `data-qmonth="${m}" class="bcol click"` })}</div>`;

  /* B. Collections */
  const live = V3.list('invoices', i => !['Draft', 'Cancelled'].includes(i.status));
  const sg = i => i.docType === 'CN' ? -1 : 1;
  const inP = live.filter(i => inR(i.date, f, t));
  const invoiced = r2(inP.reduce((a, i) => a + sg(i) * V3.toSAR(i, i.total), 0));
  const collected = r2(V3.list('payments', p => p.status !== 'Cancelled' && inR(p.date, f, t)).reduce((a, p) => a + (p.type === 'refund' ? -1 : 1) * V3.toSAR(V3.get('invoices', p.invoiceId) || V3.get('customerPOs', p.customerPOId) || {}, p.amount), 0));
  const openInv = live.filter(i => i.docType !== 'CN').map(i => ({ i, s: V3.invoiceStatus(i) }));
  const outstanding = r2(openInv.reduce((a, x) => a + V3.toSAR(x.i, Math.max(0, x.s.balance)), 0));
  const overdue = r2(openInv.filter(x => x.s.overdue).reduce((a, x) => a + V3.toSAR(x.i, x.s.balance), 0));
  const mInv = months.map(m => r2(live.filter(i => String(i.date).startsWith(m)).reduce((a, i) => a + sg(i) * V3.toSAR(i, i.total), 0)));
  const mCol = months.map(m => r2(V3.list('payments', p => p.status !== 'Cancelled' && String(p.date).startsWith(m)).reduce((a, p) => a + (p.type === 'refund' ? -1 : 1) * V3.toSAR(V3.get('invoices', p.invoiceId) || V3.get('customerPOs', p.customerPOId) || {}, p.amount), 0)));
  const cmax = Math.max(invoiced, collected, outstanding, 1);
  const cardC = `<div class="panel chart-card"><div class="ph"><h2>Customer collections</h2><a class="small" data-go="invoices">Invoice register →</a></div>
    ${hrow('Invoiced', invoiced, cmax, C.rev, 'data-go="invoices"')}${hrow('Collected', collected, cmax, C.profit, 'data-go="payments"')}${hrow('Outstanding', outstanding, cmax, C.cost, 'data-invst="" data-go="invoices"')}${hrow('Overdue', overdue, cmax, '#c8102e', 'data-invst="Overdue"')}
    <h4 class="ch-sub">Invoiced vs collected — last 12 months (incl. VAT)</h4>${legend([['Invoiced', C.rev], ['Collected', C.profit]])}${vbars(months, [{ name: 'Invoiced', vals: mInv, color: C.rev }, { name: 'Collected', vals: mCol, color: C.profit }], { h: 130, label: 'Invoiced versus collected by month', attr: m => `data-imonth="${m}" class="bcol click"` })}</div>`;

  /* C. Supplier payments */
  const SP = V3.list('supplierPOs', p => p.status !== 'Cancelled' && inR(p.date, f, t));
  const spVal = r2(SP.reduce((a, p) => a + V3.toSAR(p, p.total), 0));
  const siVal = r2(V3.list('supplierInvoices', x => x.status !== 'Cancelled' && inR(x.date, f, t)).reduce((a, x) => a + num(x.total), 0));
  const spPaid = r2(V3.list('supplierPayments', x => x.status !== 'Cancelled' && inR(x.date, f, t)).reduce((a, x) => a + num(x.amount), 0));
  const spOut = r2(V3.list('suppliers').reduce((a, x) => a + Math.max(0, V3.supplierBalance(x.id)), 0));
  const smax = Math.max(spVal, siVal, spPaid, spOut, 1);
  const bySup = V3.list('suppliers').map(x => ({ x, b: V3.supplierBalance(x.id) })).filter(y => y.b > 0.004).sort((a, b) => b.b - a.b).slice(0, 4);
  const cardS = `<div class="panel chart-card"><div class="ph"><h2>Supplier payments</h2><a class="small" data-go="supplierPayments">Supplier payments →</a></div>
    ${hrow('Supplier POs', spVal, smax, C.rev, 'data-go="supplierPOs"')}${hrow('Invoices received', siVal, smax, C.direct, 'data-go="supplierInvoices"')}${hrow('Paid', spPaid, smax, C.profit, 'data-go="supplierPayments"')}${hrow('Outstanding', spOut, smax, C.cost, 'data-go="supplierPayments"')}
    ${bySup.length ? `<h4 class="ch-sub">Largest amounts owed</h4>${bySup.map(y => hrow(y.x.name, y.b, bySup[0].b, C.cost, `data-go="suppliers:${y.x.id}"`)).join('')}` : '<p class="muted small">Nothing owed to suppliers.</p>'}</div>`;

  /* D. Project profitability */
  const projs = V3.projectsAll ? V3.projectsAll().map(p => ({ p, F: V3.projectFin(p) })) : [];
  const view = dsh.projView || 'actual';

  const pmax = Math.max(1, ...top.map(x => Math.max(x.v.rev, x.v.cost + x.v.direct)));
  const bar = (v, c, lab) => `<i style="width:${Math.max(0, v) / pmax * 100}%;background:${c}" data-tip="${esc(lab + ': SAR ' + amt(v))}"></i>`;
  const cardP = `<div class="panel chart-card"><div class="ph"><h2>Project profitability <small>excl. VAT</small></h2><div class="seg sm"><button data-pv="actual" class="${view === 'actual' ? 'on' : ''}">Actual (invoiced)</button><button data-pv="expected" class="${view === 'expected' ? 'on' : ''}">Expected (orders)</button></div></div>

  /* E. Top customers */
  const custs = V3.list('customers').map(c => {

  const cmx = Math.max(1, ...custs.map(x => x.business));
  const cardT = `<div class="panel chart-card"><div class="ph"><h2>Top customers</h2><a class="small" data-go="customers">All customers →</a></div>
    ${legend([['Business (POs)', C.rev], ['Received', C.profit], ['Outstanding', C.cost], ['Credit', C.direct]])}

    <p class="muted small">Click a customer to open their consolidated statement.</p></div>`;

  return `<div class="grid2">${cardQ}${cardC}</div><div style="margin-top:14px">${cardP}</div><div class="grid2" style="margin-top:14px">${cardS}${cardT}</div>`;
};

/* chart drill-downs */
document.addEventListener('click', e => {
  const q = e.target.closest('[data-qst]'); if (q) { Object.assign(V3.quoteFilter, { status: q.dataset.qst, from: '', to: '', q: '', cust: '' }); return V3.go('quotations'); }

  const is = e.target.closest('[data-invst]'); if (is) { e.stopPropagation(); Object.assign(V3.invoiceFilter, { status: is.dataset.invst, from: '', to: '', q: '', cust: '', type: '' }); return V3.go('invoices'); }
}, true);
})();

<script>
/* m_backup.js */
/* V3 — full backup package: one .zip with every record, every attached file and a manifest that

/* ---- export ---- */
const safe = s => String(s || '').replace(/[\\/:*?"<>|#%]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 90) || 'file';
const DATA_COLS = () => V3.COLS.filter(c => c !== 'backups');
const flat = r => { const o = {}; Object.entries(r).forEach(([k, v]) => { if (k === 'history' || k === 'entries') return; if (v === null || v === undefined) o[k] = ''; else if (Array.isArray(v)) o[k] = v.length && typeof v[0] === 'object' ? v.map(x => [x.desc || x.name || '', x.qty !== undefined ? 'qty ' + x.qty : '', x.price !== undefined ? '@ ' + x.price : ''].filter(Boolean).join(' ')).join(' | ') : v.join(', '); else if (typeof v === 'object') o[k] = Object.entries(v).filter(([, x]) => x).map(([a, b]) => a + '=' + b).join('; '); else o[k] = v; }); return o; };

      add(path, data); files.push({ docId: d.id, path, fileName: d.fileName, category: d.category, contentType: d.contentType, size: data.length, sha256: d.sha256, refNo: d.refNo || '', links: d.links || {}, extraLinks: d.extraLinks || [], belongsTo: linkLabel(d), status: d.status });

  progress('Building package…');

/* ---- import ---- */
V3.readPackage = async file => {
  const z = await V3.zipRead(file);

V3.importPackage = async (pkg, mode, progress = () => { }) => {

document.addEventListener('change', async e => {

  const msg = V3.$('#pkgMsg');

    const r = await V3.dialog({ title: 'Restore backup package', html: `<p>Package from <b>${esc(M.company || '')}</b>, created <b>${esc(new Date(M.exportedAt).toLocaleString())}</b>.<br><small class="muted">${Object.entries(M.counts).filter(([, v]) => v).map(([k, v]) => k + ' ' + v).join(', ')} · ${M.files.length} files</small></p><label class="chk"><input type="radio" name="pm" value="missing" checked> Add back only what is missing (safe — use this when moving to a new computer)</label><label class="chk"><input type="radio" name="pm" value="all"> Overwrite records with the package versions</label><p class="muted small">Every file is re-attached to the record it belongs to. A cloud backup of the current data is taken first.</p>`, okText: 'Restore', danger: true, collect: w => ({ mode: V3.$('input[name=pm]:checked', w).value }) });
    if (!r) return;
    if (V3.P.assets && V3.cloudBackup) { try { await V3.cloudBackup('Before restore'); } catch (er) { } }
    const res = await V3.importPackage(pkg, r.mode, t => { if (msg) msg.textContent = t; });
    if (msg) msg.textContent = `Restored ${res.records} records; ${res.filesUploaded} files uploaded, ${res.filesReused} already present.`;
    V3.toast('Backup package restored'); V3.audit({ col: 'system', ref: 'Restore', action: 'Backup package restored', reason: `${r.mode === 'missing' ? 'Missing only' : 'Overwrite'} · package of ${M.exportedAt}`, changes: [{ field: 'files', from: '', to: String(res.filesUploaded) }] });
  } catch (er) { V3.toast('Restore failed: ' + V3.errText(er), 'err'); if (msg) msg.textContent = ''; }

<script>
/* m_archive.js */
/* V3 — archive old, fully settled business into a zip (records + files + summaries) and remove it from the active data */
'use strict';
(() => {
const { esc, num, r2, fmtDate, money, amt, today, uid } = V3;
const inR = (d, f, t) => !!d && d >= f && d <= t;
const LIVE = x => x && x.status !== 'Cancelled';

/* every record that belongs to one quotation's order chain */
const chainOf = q => {
  const C = { quotations: [q] };
  C.customerPOs = V3.list('customerPOs', p => p.quotationId === q.id); const poIds = new Set(C.customerPOs.map(p => p.id));
  C.invoices = V3.list('invoices', i => i.quotationId === q.id || poIds.has(i.customerPOId)); const invIds = new Set(C.invoices.map(i => i.id));
  C.deliveryNotes = V3.list('deliveryNotes', d => d.quotationId === q.id || poIds.has(d.customerPOId));
  C.payments = V3.list('payments', p => invIds.has(p.invoiceId) || (!p.invoiceId && poIds.has(p.customerPOId)));
  C.supplierPOs = V3.list('supplierPOs', s => s.quotationId === q.id || poIds.has(s.customerPOId)); const spoIds = new Set(C.supplierPOs.map(s => s.id));
  C.supplierInvoices = V3.list('supplierInvoices', s => spoIds.has(s.supplierPOId)); const siIds = new Set(C.supplierInvoices.map(s => s.id));
  C.supplierPayments = V3.list('supplierPayments', s => spoIds.has(s.supplierPOId) || siIds.has(s.supplierInvoiceId));
  C.directCosts = V3.list('directCosts', c => c.quotationId === q.id);
  return C;
};
const dateOf = (col, r) => col === 'customerPOs' ? (r.poDate || r.receivedDate) : r.date;
/* why a chain cannot be archived yet (empty list = settled) */
const blockers = (C, f, t) => {
  const why = [];
  Object.entries(C).forEach(([col, arr]) => arr.forEach(r => { const d = dateOf(col, r); if (d && !inR(d, f, t)) why.push(`${V3.ARCH_LABEL[col]} ${r.no || r.poNo || r.invNo || ''} is dated ${fmtDate(d)}, outside the period`); }));
  const q = C.quotations[0]; const qs = V3.quoteStatus(q);
  const livePOs = C.customerPOs.filter(LIVE);
  if (!livePOs.length) { if (!['Rejected', 'Expired', 'Cancelled'].includes(qs) && !C.invoices.some(i => !['Draft', 'Cancelled'].includes(i.status))) why.push(`Quotation is still ${qs} — mark it Rejected or Cancelled, or record the customer PO`); }
  livePOs.forEach(p => { if (p.status !== 'Closed') why.push(`Customer PO ${V3.poLabel(p)} is still Open`); const a = V3.poAdvances(p.id); if (a.unapplied > 0.004) why.push(`Customer PO ${V3.poLabel(p)} has an advance of ${amt(a.unapplied)} not yet invoiced`); });
  C.invoices.forEach(i => { if (i.status === 'Draft') why.push(`Draft invoice for ${i.custName} is not issued or cancelled`); else if (i.docType !== 'CN' && i.status !== 'Cancelled') { const b = V3.invoiceStatus(i).balance; if (b > 0.004) why.push(`Invoice ${i.no} still has ${amt(b)} unpaid`); if (b < -0.004) why.push(`Invoice ${i.no} is overpaid by ${amt(-b)} (customer credit)`); } });
  C.deliveryNotes.filter(LIVE).forEach(d => { if (['Draft', 'Ready for Dispatch'].includes(d.status)) why.push(`Delivery note ${d.no} is not dispatched`); });
  C.supplierPOs.filter(LIVE).forEach(s => { const st = V3.spoStatus(s); if (Math.abs(st.balance) > 0.004) why.push(`Supplier PO ${s.no}: ${st.balance > 0 ? amt(st.balance) + ' still owed to supplier' : amt(-st.balance) + ' paid in advance, supplier invoice missing'}`); else if (!st.invoiced && s.status !== 'Closed') why.push(`Supplier PO ${s.no} has no supplier invoice`); });
  return [...new Set(why)];
};
V3.ARCH_LABEL = { quotations: 'Quotation', customerPOs: 'Customer PO', invoices: 'Invoice', deliveryNotes: 'Delivery note', payments: 'Receipt', supplierPOs: 'Supplier PO', supplierInvoices: 'Supplier invoice', supplierPayments: 'Supplier payment', directCosts: 'Direct cost' };

V3.archivePlan = (f, t) => {
  const ready = [], blocked = []; const taken = new Set();
  V3.list('quotations', q => inR(q.date, f, t)).sort((a, b) => String(a.date).localeCompare(b.date)).forEach(q => { const C = chainOf(q); const w = blockers(C, f, t); (w.length ? blocked : ready).push({ q, C, why: w }); });
  ready.forEach(x => Object.values(x.C).flat().forEach(r => taken.add(r)));
  // stand-alone supplier POs (stock purchases not linked to a customer order)
  const stock = V3.list('supplierPOs', s => !s.quotationId && !s.customerPOId && inR(s.date, f, t)).map(s => { const C = { supplierPOs: [s] }; C.supplierInvoices = V3.list('supplierInvoices', x => x.supplierPOId === s.id); C.supplierPayments = V3.list('supplierPayments', x => x.supplierPOId === s.id); const st = V3.spoStatus(s); const why = []; Object.entries(C).forEach(([col, arr]) => arr.forEach(r => { if (!inR(dateOf(col, r), f, t)) why.push(`${V3.ARCH_LABEL[col]} dated ${fmtDate(dateOf(col, r))} is outside the period`); })); if (s.status !== 'Cancelled' && Math.abs(st.balance) > 0.004) why.push(`Supplier PO ${s.no} is not fully paid`); return { s, C, why }; });
  const recs = {}; const add = (col, r) => { (recs[col] ||= new Map()).set(r.id, r); };
  ready.forEach(x => Object.entries(x.C).forEach(([col, arr]) => arr.forEach(r => add(col, r))));
  stock.filter(x => !x.why.length).forEach(x => Object.entries(x.C).forEach(([col, arr]) => arr.forEach(r => add(col, r))));
  const ids = new Set(Object.values(recs).flatMap(m => [...m.keys()]));
  const KEYS = ['customerId', 'quotationId', 'customerPOId', 'supplierPOId', 'supplierInvoiceId', 'deliveryNoteId', 'invoiceId', 'paymentId', 'supplierPaymentId', 'directCostId'];
  // a file goes into the archive only if everything it is linked to is archived (customer/supplier links don't count)
  const docs = V3.list('documents', d => { const L = { ...(d.links || {}) }; delete L.customerId; delete L.supplierId; const v = Object.values(L).filter(Boolean); return v.length && v.every(id => ids.has(id)); });
  docs.forEach(d => add('documents', d));
  const counts = {}; Object.entries(recs).forEach(([c, m]) => counts[c] = m.size);
  return { from: f, to: t, ready, blocked, stockReady: stock.filter(x => !x.why.length), stockBlocked: stock.filter(x => x.why.length), recs, counts, total: Object.values(counts).reduce((s, x) => s + x, 0) };
};

/* build the zip (same layout as a full backup package, so it can be restored the same way) */
const csvOf = rows => { if (!rows.length) return ''; const keys = [...new Set(rows.flatMap(r => Object.keys(r)))].filter(k => !['history', 'lines', 'entries'].includes(k)); return V3.csv([keys, ...rows.map(r => keys.map(k => { const v = r[k]; return v && typeof v === 'object' ? JSON.stringify(v) : (v ?? ''); }))]); };
V3.runArchive = async (plan, progress = () => { }) => {
  const enc = new TextEncoder(); const entries = []; const add = (n, d) => entries.push({ name: n, data: typeof d === 'string' ? enc.encode(d) : d });
  const recs = {}; Object.entries(plan.recs).forEach(([c, m]) => recs[c] = [...m.values()]);
  Object.entries(recs).forEach(([c, arr]) => { add(`data/${c}.json`, JSON.stringify(arr, null, 1)); add(`tables/${c}.csv`, csvOf(arr)); });
  // reference copies of master data (they stay in the active system too)
  const custIds = new Set(Object.values(recs).flat().map(r => r.customerId).filter(Boolean)), supIds = new Set(Object.values(recs).flat().map(r => r.supplierId).filter(Boolean));
  add('reference/customers.json', JSON.stringify(V3.list('customers', c => custIds.has(c.id)), null, 1)); add('reference/suppliers.json', JSON.stringify(V3.list('suppliers', s => supIds.has(s.id)), null, 1));
  // project summary at the time of archiving
  const sum = plan.ready.map(x => { const p = V3.profitFor(x.q.id); return [x.q.no, x.q.custName, x.q.project || '', fmtDate(x.q.date), V3.quoteStatus(x.q), p.revenue, p.material, p.direct, p.gp, p.revenue ? p.margin.toFixed(1) + '%' : '']; });
  add('SUMMARY.csv', V3.csv([['Quotation', 'Customer', 'Project', 'Date', 'Status', 'Revenue excl. VAT', 'Cost of goods', 'Direct costs', 'Gross profit', 'Margin'], ...sum]));
  const files = []; const docs = recs.documents || [];
  for (let i = 0; i < docs.length; i++) { const d = docs[i]; progress(`Collecting files ${i + 1} of ${docs.length}…`); try { const u = V3.blobUrl(d.assetId); if (!u || u === '#') throw 0; const data = new Uint8Array(await (await fetch(u)).arrayBuffer()); const path = `files/${String(d.category || 'Other').replace(/[\\/:*?"<>|]/g, '-')}/${d.id}__${String(d.fileName).replace(/[\\/:*?"<>|]/g, '-')}`; add(path, data); files.push({ docId: d.id, path, fileName: d.fileName, category: d.category, contentType: d.contentType, size: data.length, sha256: d.sha256, links: d.links || {} }); } catch (e) { } }
  const manifest = { app: 'V3 Specialized Business System', format: 'v3-package', kind: 'archive', version: 3, from: plan.from, to: plan.to, exportedAt: new Date().toISOString(), company: V3.company().name, counts: plan.counts, files, missing: [] };
  add('manifest.json', JSON.stringify(manifest, null, 1));
  add('README.txt', `V3 Specialized — ARCHIVE ${plan.from} to ${plan.to}\r\nCreated ${manifest.exportedAt}\r\nContains fully settled business from this period that was removed from the active system.\r\nSUMMARY.csv = profit per quotation. tables/ = all records for Excel. files/ = all documents.\r\nTo bring it back: V3 > Settings > Archive > Restore an archive.\r\n`);
  const blob = V3.zipBuild(entries); const name = `V3-archive-${plan.from}-to-${plan.to}.zip`;
  progress('Saving archive…');
  let inFolder = false; if (window.V3_DESKTOP && V3_DESKTOP.saveToFolder) { try { inFolder = await V3_DESKTOP.saveToFolder(['archives', name], blob); } catch (e) { } }
  if (!inFolder) { const ok = await V3.saveFile(name, blob, 'application/zip'); if (!ok) throw new Error('The archive file was not saved, so nothing was removed.'); }
  // only now remove the archived records from the active data
  const reason = `Archived to ${name}`; let n = 0; const total = plan.total;
  for (const [col, arr] of Object.entries(recs)) for (const r of arr) { await V3.remove(col, r.id, reason); n++; if (n % 20 === 0) progress(`Removing archived records ${n} of ${total}…`); }
  for (const d of docs) { try { if (window.V3_DESKTOP && V3_DESKTOP.removeFromFolder) await V3_DESKTOP.removeFromFolder(d); if (V3.P.assets && V3.P.assets.delete) await V3.P.assets.delete(d.assetId); } catch (e) { } }
  await V3.save('archives', { id: uid(), from: plan.from, to: plan.to, fileName: name, inFolder, counts: plan.counts, files: files.length, sizeMB: r2(blob.size / 1048576), at: new Date().toISOString(), by: V3.P.uid, quotations: plan.ready.map(x => x.q.no) }, { action: 'Archive created' });
  return { name, inFolder, blob, files: files.length };
};

/* automatic: once a month, archive settled business older than N months */
V3.maybeAutoArchive = async () => {
  const s = V3.company(); if (!s.autoArchive || !(V3.P.isOwner || V3.P.canEdit)) return;
  const months = num(s.autoArchiveMonths) || 12; const last = V3.list('archives', a => a.auto).map(a => a.at).sort().pop();
  if (last && Date.now() - new Date(last).getTime() < 28 * 864e5) return;
  const d = new Date(); const end = new Date(d.getFullYear(), d.getMonth() - months + 1, 0); const to = new Date(end.getTime() - end.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const first = V3.list('quotations').map(q => q.date).filter(Boolean).sort()[0]; if (!first || first > to) return;
  const plan = V3.archivePlan(first, to); if (!plan.total) return;
  if (window.V3_DESKTOP && V3_DESKTOP.FS && V3_DESKTOP.FS.state !== 'connected') return; // only when the archive can be written to the data folder
  try { const r = await V3.runArchive(plan); const a = V3.list('archives').find(x => x.fileName === r.name); if (a) await V3.save('archives', { ...a, auto: true }, { noAudit: true }); V3.toast(`Automatic archive: ${plan.ready.length} settled quotation(s) up to ${fmtDate(to)} moved to ${r.name}`, 'info'); } catch (e) { console.warn('auto archive', e); }
};

/* ---------- Settings → Archive tab ---------- */
const af = { from: '', to: '', plan: null };

  const s = V3.company(); const P = af.plan;

  return `<h2>Archive old records</h2><p class="muted small">Move fully settled business from a period you choose into a zip archive (records as JSON + Excel tables + every attached file + a profit summary). It is removed from the active system, which keeps the app fast and your storage small. Only complete, settled order chains are archived: quotation, customer PO (closed), invoices (fully paid), receipts, delivery notes, supplier POs, supplier invoices and payments (fully paid) — all dated inside the period. Anything still open stays active and is listed with the reason. Customers, suppliers and materials always stay.</p>
  <div class="filters"><label class="fld"><span>From</span><input type="date" id="arF" value="${af.from}"></label><label class="fld"><span>To</span><input type="date" id="arT" value="${af.to}"></label><button class="btn ghost" data-arch="preview">Preview</button>${P && P.total && isAdmin ? `<button class="btn" data-arch="run">Archive ${P.ready.length + P.stockReady.length} settled order(s) now</button>` : ''}</div>
  ${P ? `<div class="pkgbox"><b>${fmtDate(P.from)} – ${fmtDate(P.to)}:</b> ${P.ready.length} quotation chain(s) and ${P.stockReady.length} stock purchase(s) ready — ${P.total} records (${Object.entries(P.counts).map(([k, v]) => v + ' ' + k).join(', ') || 'none'}). ${P.blocked.length + P.stockBlocked.length ? `<br><b>${P.blocked.length + P.stockBlocked.length} stay active</b> because they are not settled:` : ''}
    ${P.blocked.length ? `<ul class="small">${P.blocked.slice(0, 30).map(x => `<li><a data-go="quotations:${x.q.id}">${esc(x.q.no)}</a> ${esc(x.q.custName || '')}: ${esc(x.why.slice(0, 3).join('; '))}${x.why.length > 3 ? ' …' : ''}</li>`).join('')}</ul>` : ''}${P.stockBlocked.length ? `<ul class="small">${P.stockBlocked.map(x => `<li>${esc(x.s.no)}: ${esc(x.why.join('; '))}</li>`).join('')}</ul>` : ''}</div>` : ''}
  <div id="arMsg" class="small muted"></div>
  <h3>Automatic archiving</h3><label class="chk"><input type="checkbox" id="arAuto" ${s.autoArchive ? 'checked' : ''} ${isAdmin ? '' : 'disabled'}> Once a month, automatically archive settled business older than <input type="number" id="arMonths" min="3" max="60" value="${num(s.autoArchiveMonths) || 12}" style="width:60px" ${isAdmin ? '' : 'disabled'}> months</label><p class="muted small">${window.V3_DESKTOP ? 'Runs when the app is opened and the data folder is connected; the zip is saved in the folder’s <b>archives</b> sub-folder.' : 'Runs when an administrator opens the app; the zip is downloaded.'}</p>
  <h3>Archives created</h3>${V3.table([{ h: 'Period', f: a => `${fmtDate(a.from)} – ${fmtDate(a.to)}` }, { h: 'File', f: a => esc(a.fileName) + (a.inFolder ? ' <small class="muted">(in data folder › archives)</small>' : ' <small class="muted">(downloaded)</small>') }, { h: 'Records', num: true, f: a => Object.values(a.counts || {}).reduce((s, x) => s + x, 0) }, { h: 'Files', num: true, f: a => a.files }, { h: 'Size', num: true, f: a => (a.sizeMB || 0) + ' MB' }, { h: 'Created', f: a => esc(new Date(a.at).toLocaleString()) + (a.auto ? ' · auto' : '') }], arch, { empty: 'No archives yet.' })}
  ${isAdmin ? `<label class="btn ghost" style="margin-top:8px">Restore an archive…<input type="file" id="arRestore" accept=".zip" hidden></label>` : ''}`;
};
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-arch]'); if (!b) return;

  if (af.from > af.to) return V3.toast('"From" must be before "To".', 'err');
  if (b.dataset.arch === 'preview') { af.plan = V3.archivePlan(af.from, af.to); return V3.rerender(); }
  if (b.dataset.arch === 'run') {

    const ok = await V3.dialog({ title: `Archive ${fmtDate(P.from)} – ${fmtDate(P.to)}?`, html: `<p>${P.ready.length + P.stockReady.length} settled order(s), ${P.total} records and their files will be saved to <b>V3-archive-${P.from}-to-${P.to}.zip</b>${window.V3_DESKTOP ? ' in your data folder' : ''} and then removed from the active system.</p><p class="muted small">Records are removed only after the zip is saved. You can bring them back at any time with "Restore an archive".</p>`, okText: 'Create archive', danger: true });
    if (!ok) return; b.disabled = true; const m = V3.$('#arMsg');
    try { const r = await V3.runArchive(P, t => { if (m) m.textContent = t; }); af.plan = null; V3.toast(`Archive created: ${r.name}`); V3.rerender(); } catch (er) { V3.toast(V3.errText(er), 'err'); } finally { b.disabled = false; }
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'arAuto' || e.target.id === 'arMonths') { try { await V3.save('settings', { ...V3.company(), id: 'company', autoArchive: V3.$('#arAuto').checked, autoArchiveMonths: num(V3.$('#arMonths').value) || 12 }, { action: 'Automatic archiving changed' }); V3.toast('Saved'); } catch (er) { V3.toast(V3.errText(er), 'err'); } }
  if (e.target.id === 'arRestore') { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const pkg = await V3.readPackage(f); const ok = await V3.confirm('Restore archive', `Bring back ${Object.values(pkg.manifest.counts).reduce((s, x) => s + x, 0)} records and ${pkg.manifest.files.length} files from ${pkg.manifest.from || ''} – ${pkg.manifest.to || ''} into the active system?`); if (!ok) return; const r = await V3.importPackage(pkg, 'missing'); V3.toast(`Restored ${r.records} records and ${r.filesUploaded} files`); } catch (er) { V3.toast('Restore failed: ' + V3.errText(er), 'err'); } }
});
})();

<script>
/* app.js */
/* V3 — application shell: navigation, routing, global search, boot */
'use strict';
(() => {
const { esc, $, $$ } = V3;
const NAV = [
  ['Overview', [['dashboard', 'Dashboard', '▦'], ['projects', 'Projects', '🏗']]],
  ['Sales', [['customers', 'Customers', '👥'], ['quotations', 'Quotations', '📄'], ['customerPOs', 'Customer POs', '📥']]],
  ['Procurement', [['suppliers', 'Suppliers', '🏭'], ['materials', 'Material database', '🧱'], ['supplierPOs', 'Supplier POs', '📤'], ['supplierInvoices', 'Supplier invoices', '🧾'], ['supplierPayments', 'Supplier payments', '💸']]],
  ['Operations', [['deliveries', 'Delivery notes', '🚚']]],
  ['Finance', [['invoices', 'VAT invoices', '🧮'], ['payments', 'Customer payments', '💰'], ['statements', 'Statements', '📊'], ['costs', 'Direct costs', '➕']]],
  ['Management', [['reports', 'Reports & profit', '📈'], ['archive', 'Document archive', '🗄'], ['audit', 'Audit trail', '🕘'], ['settings', 'Settings & backup', '⚙']]]
];
const permOf = k => V3.MOD_PERM[k] || (V3.mods[k] && V3.mods[k].perm) || k;
V3.state = { mod: 'dashboard', id: null, arg: null };
const hist = [];

V3.go = (mod, id = null, opt = {}) => {
  if (!opt.replace && (V3.state.mod !== mod || V3.state.id !== id)) hist.push({ ...V3.state });
  V3.state = { mod, id, arg: opt.arg || null };
  try { if (location.hash.slice(1) !== mod) history.replaceState(null, '', '#' + mod); } catch (e) { }
  render(true);
  window.scrollTo(0, 0); const m = $('#main'); if (m) m.scrollTop = 0;
};
V3.rerender = () => render(true);
V3.rerenderWith = W => { V3._draft = W; render(true); };

function nav() {
  const role = V3.role();
  $('#nav').innerHTML = NAV.map(([g, items]) => { const vis = items.filter(([k]) => V3.can(permOf(k), 'view')); return vis.length ? `<div class="ngroup"><div class="nh">${g}</div>${vis.map(([k, l, i]) => `<a href="#${k}" data-nav="${k}" class="${V3.state.mod === k ? 'on' : ''}"><span class="ni">${i}</span>${esc(l)}</a>`).join('')}</div>` : ''; }).join('');
  const c = V3.company(); $('.top .co').innerHTML = `<b>${esc(c.name)}</b><br>VAT ${esc(c.vat)} · CR ${esc(c.cr)}`;
  $('#who').innerHTML = `${esc(V3.userName(V3.P.uid))}<small>${esc(V3.ROLES[role])}</small>`;

let lastSig = '';
function render(force) {

  const active = document.activeElement;

    const rec = editing && V3.state.id !== 'new' ? findRec() : null;
    if (rec && rec.updatedBy && rec.updatedBy !== V3.P.uid && rec.updatedAt !== lastSig) { lastSig = rec.updatedAt; V3.banner(`${V3.userName(rec.updatedBy)} just changed this record. Reload it to see their changes before saving.`, 'warn'); }
    return;
  }
  const mod = V3.mods[V3.state.mod];
  if (!mod) { V3.state = { mod: 'dashboard', id: null }; return render(true); }
  if (!V3.can(permOf(V3.state.mod), 'view')) { el.innerHTML = `<div class="panel"><h1>No access</h1><p>Your role (${esc(V3.ROLES[V3.role()])}) cannot open ${esc(mod.title)}. Ask an administrator to change your permissions.</p></div>`; return; }
  if (force) V3.banner('');
  try { mod.render(el); } catch (e) { console.error(e); el.innerHTML = `<div class="panel"><h1>Something went wrong</h1><pre class="small">${esc(e.stack || e.message)}</pre></div>`; }

const COLMAP = { customers: 'customers', suppliers: 'suppliers', materials: 'materials', quotations: 'quotations', customerPOs: 'customerPOs', supplierPOs: 'supplierPOs', supplierInvoices: 'supplierInvoices', supplierPayments: 'supplierPayments', deliveries: 'deliveryNotes', invoices: 'invoices', payments: 'payments', costs: 'directCosts' };
const findRec = () => V3.get(COLMAP[V3.state.mod], V3.state.id);
V3.onData = () => render(false);
V3.onReady = () => {
  $('#boot').hidden = true; $('#app').hidden = false;
  const h = location.hash.slice(1); if (h && V3.mods[h]) V3.state.mod = h;
  if (!V3.get('settings', 'company') && (V3.P.isOwner || V3.P.canEdit)) setTimeout(() => V3.banner('Welcome! Company details are pre-filled from your existing application — review them under Settings → Company, then register your customers and materials.', 'info'), 400);
  render(true);
  setTimeout(V3.maybeAutoBackup, 8000);
  setTimeout(() => V3.maybeAutoArchive && V3.maybeAutoArchive(), 15000);
  if (window.V3_DEMO && window.V3_DEMO.afterReady) window.V3_DEMO.afterReady();

/* global events */
document.addEventListener('click', e => {

/* tooltips for chart bars */
document.addEventListener('mouseover', e => { const b = e.target.closest('[data-tip]'); const t = $('#tip'); if (!b) { t.hidden = true; return; } t.textContent = b.dataset.tip; t.hidden = false; const r = b.getBoundingClientRect(); t.style.left = Math.min(window.innerWidth - 240, r.left) + 'px'; t.style.top = (r.top - 34 + window.scrollY) + 'px'; });
/* global search */
const gs = () => {
  const inp = $('#gsearch'), box = $('#gresults');
  let act = -1, res = [];
  const draw = () => { res = V3.globalSearch(inp.value); box.hidden = !inp.value || inp.value.length < 2; box.innerHTML = res.length ? res.map((r, i) => `<div class="gr${i === act ? ' on' : ''}" data-i="${i}"><span class="tag">${esc(r.kind)}</span><b>${esc(r.title)}</b><small>${esc(r.sub || '')}</small></div>`).join('') : '<div class="empty">No matches.</div>'; };
  const open = r => { box.hidden = true; inp.value = ''; V3.go(r.mod, r.id); };
  inp.addEventListener('input', () => { act = -1; draw(); });
  inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { act = Math.min(res.length - 1, act + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { act = Math.max(0, act - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter' && res[Math.max(0, act)]) open(res[Math.max(0, act)]); else if (e.key === 'Escape') { box.hidden = true; inp.blur(); } });
  box.addEventListener('mousedown', e => { const r = e.target.closest('[data-i]'); if (r) { e.preventDefault(); open(res[Number(r.dataset.i)]); } });
  inp.addEventListener('blur', () => setTimeout(() => box.hidden = true, 150));
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); inp.focus(); } });
};

/* boot */
document.addEventListener('DOMContentLoaded', async () => {
  $('#hdrLogo').src = V3_BRAND.logo;
  gs();
  try { await V3.initPlatform(); }
  catch (e) {
    $('#bootMsg').innerHTML = e.message === 'nohost' ? 'Could not start. Please check your internet connection and reload.' : e.message === 'nodb' ? 'Please sign in to claude.ai to use the V3 business system. If you are signed in, ask the owner to share the app with you.' : 'Could not connect to the database: ' + esc(e.message);
    $('#bootSpin').hidden = true;
  }
});
})();

</script>
<script>
/* V3 — Google sign-in edition: Settings › Data storage panel + daily snapshot into Drive */
(() => {
  const D = window.V3_DESKTOP, FS = D.FS, esc = V3.esc;
  V3.storagePanelHtml = () => {
    const st = FS.state, shared = (() => { try { return localStorage.getItem('v3.sharedFolder'); } catch (e) { return null; } })();
    return `<div class="pkgbox" style="border-color:${st === 'connected' ? '#9fd8b4' : '#f5d38f'};background:${st === 'connected' ? '#f3fbf6' : '#fff8eb'}">
    <h3 style="margin:0 0 4px">Data storage — Google Drive</h3>
    ${st === 'connected' ? `<p>✅ Signed in as <b>${esc(D.email())}</b>. Data is saved in the Google Drive folder <b>${esc(FS.folder)}</b>${shared ? ' (shared folder)' : ''} within a few seconds of every change${FS.lastSaved ? ' — last saved ' + new Date(FS.lastSaved).toLocaleString() : ''}. Changes from other users and devices arrive within a few seconds.${D.pending() ? ' <b>' + D.pending() + ' change(s) waiting to upload.</b>' : ''}</p>${FS.error ? `<p class="neg small">${esc(FS.error)}</p>` : ''}`
      : `<p>⚠ Not signed in. Until you sign in, data is kept only in this browser.</p>`}
    <div class="actions">${st === 'connected' ? `<button class="btn ghost" onclick="V3_DESKTOP.syncNow()">Sync now</button><button class="btn ghost" onclick="V3_DESKTOP.disconnect()">Sign out</button>` : `<button class="btn" onclick="V3_DESKTOP.signIn()">Sign in with Google</button>`}</div>
    <h4 style="margin:14px 0 4px">Which Drive folder</h4>
    <p class="small muted">The company owner signs in and the app creates the folder <b>V3-Data</b> in their Drive. To let staff use the same data, share that folder with them in Google Drive (Editor), then on their device paste the folder link below and sign in with their own Google account.</p>
    <div class="inline" style="max-width:640px"><input id="sharedLink" placeholder="https://drive.google.com/drive/folders/…" value="${shared ? 'https://drive.google.com/drive/folders/' + esc(shared) : ''}"><button class="btn ghost sm" onclick="V3_DESKTOP.useSharedFolder(document.getElementById('sharedLink').value)">Use shared folder</button>${shared ? '<button class="btn ghost sm" onclick="V3_DESKTOP.useOwnFolder()">Use my own V3-Data</button>' : ''}</div>
    <label class="fld" style="max-width:320px;margin-top:10px"><span>Your name (shown in the audit trail)</span><input id="pcName" value="${esc(D.myName())}" onchange="V3_DESKTOP.setName(this.value)"></label>
    <details style="margin-top:10px" ${D.clientId() ? '' : 'open'}><summary class="small"><b>Administrator set-up: Google client ID</b> ${D.clientId() ? '✓ set' : '— required once'}</summary>
      <p class="small muted">Paste the OAuth client ID created in Google Cloud (it ends with <code>.apps.googleusercontent.com</code>). It is not a password.</p>
      <div class="inline" style="max-width:640px"><input id="clientIdIn" value="${esc(D.clientId())}" placeholder="1234567890-abc….apps.googleusercontent.com"><button class="btn ghost sm" onclick="V3_DESKTOP.setClientId(document.getElementById('clientIdIn').value)">Save</button></div></details>
    <p class="small muted" style="margin-top:8px">Inside V3-Data: <code>records/&lt;type&gt;/&lt;id&gt;.json</code> (one JSON file per record), <code>files/…</code> (every receipt, PO and invoice by category; <code>files/INDEX.csv</code> says which record each belongs to), <code>archives/</code>, <code>backups/</code> (daily snapshot of all records, last 30 kept).</p></div>`;
  };
  V3.maybeAutoBackup = async () => {
    try {
      if (FS.state !== 'connected') return; const name = `V3-records-${V3.today()}.json`;
      if (await FS.exists(['backups', name])) return;
      await FS.write(['backups', name], JSON.stringify(V3.snapshot()));
      const old = (await FS.list(['backups'])).filter(n => /^V3-records-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort().slice(0, -30);
      for (const n of old) await FS.remove(['backups', n]).catch(() => { });
    } catch (e) { console.warn('daily snapshot', e); }
  };
  V3.cloudBackup = null;
  setInterval(() => V3.maybeAutoBackup(), 3600e3);
})();

</script>
<script>

/* V3 — phone layout: compact header, bottom tab bar, card lists, tidy filters. Only active on narrow screens. */
(() => {

    inv: '<path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12h6M9 15.5h3"/>',

  const svg = k => `<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>`;
  const TABS = [['dashboard', 'Home', 'home'], ['quotations', 'Quotes', 'quote'], ['customerPOs', 'Orders', 'order'], ['invoices', 'Invoices', 'inv'], ['_more', 'More', 'more']];
  const css = `
@media (max-width:760px){
  html{-webkit-text-size-adjust:100%}

  /* header */
  .top{padding:calc(8px + env(safe-area-inset-top)) 12px 8px!important;gap:10px!important;box-shadow:0 1px 0 var(--line),0 6px 18px -14px rgba(11,43,82,.35);border-bottom:0!important}
  .top .co{display:none!important}
  #burger{display:none!important}
  .mlogo{display:block;height:30px;width:auto;flex:none}
  .gsearch{flex:1;min-width:0}
  #gsearch{height:38px;border-radius:12px!important;font-size:15px!important;background:#f3f6fa!important;border:1px solid transparent!important;padding-left:12px!important}
  #gsearch:focus{background:#fff!important;border-color:var(--navy2)!important}
  #dataPill{order:3;width:100%;margin:2px 0 0!important}
  #dataPill .dp{width:100%;justify-content:center;padding:7px 12px;font-size:12.5px}
  /* page heads: title only, actions full-width */
  .page-head{margin-bottom:12px!important;gap:10px!important}
  .page-head h1{font-size:21px!important;margin:2px 0 0!important}
  .page-head p,.page-head .muted{display:none}
  .page-head .actions{width:100%;display:flex;gap:8px;flex-wrap:wrap}
  .page-head .actions .btn{flex:1 1 auto;justify-content:center;text-align:center}
  .btn{min-height:42px;border-radius:12px!important}
  .btn.sm{min-height:34px}
  .card,.panel{border-radius:16px!important;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  /* KPI tiles */
  .kpis{grid-template-columns:1fr 1fr!important;gap:8px!important}
  .kpis>div{border-radius:14px!important;padding:10px 12px!important;border-top-width:0!important;border-left:3px solid var(--red)}
  .kpis>div span{font-size:11px!important;line-height:1.3}
  .kpis>div b{font-size:15.5px!important;letter-spacing:-.2px}
  .tabs{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs>*{flex:none;white-space:nowrap}
  svg{max-width:100%}
  .card *{max-width:100%}
  /* tables become cards */
  .tablewrap{overflow:visible!important;border:0!important;background:transparent!important}
  table.grid-table{display:block;border:0!important;background:transparent!important}
  table.grid-table thead{display:none}
  table.grid-table tbody,table.grid-table tfoot{display:block}
  table.grid-table tr{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 10px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:transform .12s ease}
